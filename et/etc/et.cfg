; et.cfg : Config file for Eternal Terminal (etserver)
; Read by etserver via --cfgfile=/etc/et.cfg (the systemd unit passes it).
; The et client does not read this file.

[Networking]
port = 2022
# bind_ip = 0.0.0.0

[Debug]
verbose = 0
silent = 0
logsize = 20971520
telemetry = true
logdirectory = /tmp
