onboarding = false

[ui.toast]
delivery = "herdr"

[theme]
name = "terminal"
auto_switch = false

[ui.sound]
enabled = false

[keys]
prefix = "ctrl+a"

# >>> furkankly.zoetrope keys (managed: `setup-keys` writes this block, `remove-keys` deletes it)
[[keys.command]]
key = "prefix+shift+z"
type = "plugin_action"
command = "furkankly.zoetrope.open"
description = "zoetrope: session graph (overlay)"

# The graph opens over the focused pane and gives the layout back when
# it closes. The same key closes it. Two other placements, if you would
# rather keep the graph on screen: uncomment one, or point the binding
# above at its action. Then: herdr server reload-config
# [[keys.command]]
# key = "prefix+shift+v"
# type = "plugin_action"
# command = "furkankly.zoetrope.open-split"
# description = "zoetrope: session graph (split)"

# [[keys.command]]
# key = "prefix+shift+c"
# type = "plugin_action"
# command = "furkankly.zoetrope.open-tab"
# description = "zoetrope: session graph (tab)"

# <<< furkankly.zoetrope keys

# >>> plannotator.herdr-annotate keys (managed: matches the plugin README's
# full-install block; no default keys ship — Herdr requires manual binding)
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+alt+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[[keys.command]]
key = "prefix+ctrl+v"
type = "plugin_action"
command = "annotate.paste-archive"
description = "paste annotations into the agent's prompt and archive them"

[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "annotate.send-archive"
description = "send annotations to the agent and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "annotate.last-newest"
description = "review the agent's newest reply"
# <<< plannotator.herdr-annotate keys
